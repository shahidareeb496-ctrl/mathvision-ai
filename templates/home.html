<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathVision AI</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --bg: #f4f6fb; --card: #ffffff; --muted: #6b7280; }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; max-width: 500px; margin: 0 auto; padding: 24px 20px; background: var(--bg); }
        h1 { font-family: 'Poppins', sans-serif; text-align: center; color: var(--primary); font-size: 26px; margin-bottom: 4px; }
        .subtitle { text-align:center; color: var(--muted); margin-bottom: 26px; font-size: 14px; }
        .chapter-card {
            background: var(--card); border-radius: 16px; padding: 18px 20px;
            margin-bottom: 12px; box-shadow: 0 2px 10px rgba(31,41,55,0.06);
            text-decoration: none; display: block; color: #111;
            transition: transform 0.12s ease, box-shadow 0.12s ease;
            animation: fadeIn 0.3s ease-out;
        }
        .chapter-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(31,41,55,0.1); }
        @keyframes fadeIn { from { opacity:0; transform: translateY(6px);} to { opacity:1; transform: translateY(0);} }
        .chapter-title { font-family: 'Poppins', sans-serif; font-size: 16.5px; font-weight: 600; margin-bottom: 8px; }
        .chapter-meta {
            font-size: 11.5px; font-weight: 600; color: var(--primary); background: #eef2ff;
            display: inline-block; padding: 4px 10px; border-radius: 20px;
        }
    </style>
</head>
<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/static/sw.js');
}
</script>
<body>
    <h1>MathVision AI</h1>
    <p class="subtitle">Pick a chapter to explore</p>

    {% for id, data in chapters.items() %}
    <a class="chapter-card" href="/chapter/{{ id }}">
        <div class="chapter-title">{{ data.title }}</div>
        <div class="chapter-meta">Grade {{ data.grade }} · {{ data.unit }}</div>
    </a>
    {% endfor %}
</body>
</html>
